name: Android APK

# Gera um APK do app para instalar no celular (sideload).
#
# O APK é uma casca Capacitor: ele abre a URL do app Next.js dentro de um
# WebView. Ou seja, o celular precisa de internet e o servidor precisa estar
# no ar — não existe versão offline, porque as rotas /api/* rodam no servidor.
#
# Como usar:
#   Actions > Android APK > Run workflow
#   app_url: (opcional) URL https do app. Vazio = usa a de mobile/capacitor.config.ts
#
# O APK sai em Artifacts, no fim da execução.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL https do app (vazio = padrão de mobile/capacitor.config.ts)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # A imagem ubuntu-latest já vem com o Android SDK. O AGP baixa sozinho
      # a plataforma/build-tools que faltar, porque as licenças já estão
      # aceitas na imagem. Isso evita o android-actions/setup-android, que
      # quebra ao aceitar licenças com o cmdline-tools 16.
      - name: Conferir SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "sem plataformas instaladas"
          ls "$ANDROID_HOME/licenses" 2>/dev/null || echo "sem arquivos de licença"

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        working-directory: mobile
        run: npm ci

      - name: Sincronizar projeto Android
        working-directory: mobile
        env:
          APP_URL: ${{ inputs.app_url }}
        run: npx cap sync android

      # O Android gera uma chave de debug nova por máquina. Num runner efêmero
      # isso significa uma chave diferente a cada build — e aí o APK novo não
      # instala por cima do anterior ("app não instalado"). O secret guarda uma
      # chave fixa, em base64; o build.gradle usa estas variáveis de ambiente
      # para assinar (sem elas, cai na chave de debug do Android).
      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE_B64 ausente: o APK vai sair com uma chave nova e não instalará por cima do anterior."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ci.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          echo "chave de assinatura restaurada: $(stat -c%s "$RUNNER_TEMP/ci.keystore") bytes"

      - name: Conferir se a URL do app responde
        working-directory: mobile
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          url="${APP_URL:-https://ais-pre-6qlnh5xu3uw7anuvtfvyaf-457178958823.us-east1.run.app}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$url" || echo 000)
          echo "URL: $url"
          echo "HTTP: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::A URL respondeu HTTP $code. O APK compila, mas vai abrir mostrando erro de conexão."
          fi

      - name: Gerar APK (debug)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Mostrar o tamanho do APK
        working-directory: mobile/android
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: simulado-prime-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
